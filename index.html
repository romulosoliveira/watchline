<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101414" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Watchline" />
    <title>Watchline</title>
    <link rel="icon" type="image/png" href="./assets/watchline-play-192.png?v=9" />
    <link rel="manifest" href="./manifest.webmanifest?v=9" />
    <link rel="apple-touch-icon" href="./assets/watchline-play-192.png?v=9" />
    <link rel="stylesheet" href="./styles.css?v=9" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <main class="loading-screen">
        <img class="loading-mark" src="./assets/watchline-play-192.png?v=9" alt="Watchline" />
        <p>Loading library...</p>
      </main>
    </div>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
        let reloadingForUpdate = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (reloadingForUpdate) return;
          reloadingForUpdate = true;
          window.location.reload();
        });

        window.addEventListener("load", async () => {
          try {
            const registration = await navigator.serviceWorker.register("./sw.js?v=9", { updateViaCache: "none" });
            await registration.update();
          } catch (_) {}
        });

        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState !== "visible") return;
          navigator.serviceWorker.getRegistration("./").then((registration) => registration?.update()).catch(() => {});
        });
      }
    </script>
    <script type="module" src="./app.js?v=9"></script>
  </body>
</html>
